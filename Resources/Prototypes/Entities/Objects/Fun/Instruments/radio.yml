- type: entity
  parent: BaseItem
  id: Radio
  name: radio
  description: Listen to the musicians broadcast.
  components:
  - type: Radio
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
    respectMidiLimits: false
  - type: ItemToggle
    soundActivate:
      path: /Audio/Items/flashlight_on.ogg
    soundDeactivate:
      path: /Audio/Items/flashlight_off.ogg
  - type: Sprite
    sprite: Objects/Fun/radio.rsi
    state: radio
  - type: Item
    heldPrefix: super
    size: Normal
    sprite: Objects/Fun/radio.rsi
